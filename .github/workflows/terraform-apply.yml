name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'envs/**'
      - 'modules/**'

permissions:
  contents: read

jobs:
  detect-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          canonical="dev stage prod"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            envs="$canonical"
          else
            changed=$(git diff --name-only "$before" "$after" -- envs modules)
            if echo "$changed" | grep -q '^modules/'; then
              envs="$canonical"
            else
              envs=""
              for e in $canonical; do
                echo "$changed" | grep -q "^envs/$e/" && envs="$envs $e"
              done
            fi
          fi

          json=$(printf '%s\n' $envs | jq -R . | jq -sc 'map(select(length>0))')
          echo "envs=$json" >> "$GITHUB_OUTPUT"

  apply:
    needs: detect-envs
    if: needs.detect-envs.outputs.envs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        env: ${{ fromJson(needs.detect-envs.outputs.envs) }}
    runs-on: ubuntu-latest
    # GitHub Environment per Terraform env - "prod" has a required-reviewer
    # protection rule configured on the repo, so this job pauses for manual
    # approval before it's allowed to apply against prod.
    environment: ${{ matrix.env }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_TABLE }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
