name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'envs/**'
      - 'modules/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- envs modules)

          canonical="dev stage prod"
          envs=""
          if echo "$changed" | grep -q '^modules/'; then
            envs="$canonical"
          else
            for e in $canonical; do
              echo "$changed" | grep -q "^envs/$e/" && envs="$envs $e"
            done
          fi

          json=$(printf '%s\n' $envs | jq -R . | jq -sc 'map(select(length>0))')
          echo "envs=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-envs
    if: needs.detect-envs.outputs.envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.detect-envs.outputs.envs) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.env }}/plan.txt', 'utf8').slice(-60000);
            const body = [
              `#### Terraform Plan — \`${{ matrix.env }}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
